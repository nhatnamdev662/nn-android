name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to attach the APK to a GitHub release on tags

jobs:
  # nn-run's translation of each agent's output, on recorded runs (linux/test/run.sh); jq comes with the runner
  helper-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test the helper on recorded agent output
        run: bash linux/test/run.sh

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true # proot and libandroid-shmem (third_party/)

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      # proot, talloc, libandroid-shmem and the pty helper, from source with a fixed NDK
      - name: Build native libraries
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" >/dev/null
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION" bash native/build.sh
        env:
          NDK_VERSION: 27.2.12479018

      # Release signing: uses NN_KEYSTORE_BASE64 if provided, otherwise the committed keystore/nn.jks
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.NN_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "NN_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # github: the release here. fdroid: F-Droid builds it from this source too, and ships this signed copy when its
      # own build comes out identical (reproducible builds), so users can switch between the two.
      - name: Build release APKs (GitHub and F-Droid)
        env:
          NN_KEYSTORE_PASSWORD: ${{ secrets.NN_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon assembleGithubRelease assembleFdroidRelease

      - name: Collect APK
        run: |
          mkdir -p dist
          apk=$(find app/build/outputs/apk/github/release -name '*.apk' | head -1)
          cp "$apk" dist/NN_AGENT.apk
          fd=$(find app/build/outputs/apk/fdroid/release -name '*.apk' | head -1)
          cp "$fd" dist/nn-agent-fdroid.apk
          echo "FDROID_APK=$PWD/dist/nn-agent-fdroid.apk" >> "$GITHUB_ENV"
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: nn-agent-apk
          path: dist/*.apk

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        # a release made by hand first (with its own notes) just gets the CI-built APKs attached
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.apk --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.apk --title "NN Agent $GITHUB_REF_NAME" --generate-notes
          fi
          # which of the APKs to download, at the end of the notes (once)
          notes=$(gh release view "$GITHUB_REF_NAME" --json body -q .body)
          case "$notes" in
            *"Which file?"*) ;;
            *) printf '%s\n\n%s\n' "$notes" "**Which file?** Download \`NN_AGENT.apk\`: it updates itself. \`nn-agent-fdroid.apk\` is only there for F-Droid's reproducible-build check, and doesn't update itself." \
                 | gh release edit "$GITHUB_REF_NAME" --notes-file - ;;
          esac

      # What F-Droid will do: build the fdroid APK again, unsigned, somewhere else, and check it matches the signed one
      # above but for the signature. After publishing, so a mismatch shows up red without holding the release back.
      - uses: actions/checkout@v7
        with:
          submodules: true
          path: rebuild-check # a second copy at another path, as F-Droid's build machine would have

      - name: Check the F-Droid APK is reproducible
        run: |
          pip install --quiet apksigcopier
          export PATH="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1):$PATH" # apksigner
          cd rebuild-check
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018" bash native/build.sh
          env -u NN_KEYSTORE NN_UNSIGNED=1 ./gradlew --no-daemon assembleFdroidRelease
          unsigned=$(find app/build/outputs/apk/fdroid/release -name '*.apk' | head -1)
          apksigcopier compare --unsigned "$FDROID_APK" "$unsigned"
          echo "The F-Droid APK is reproducible"
